name: Invoke DB Updator
on:
  schedule:
    # 6pm UTC every day
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  invoke-scrapers:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Invoke DB Updator
        run: |
          echo "Invoking DB Updator..."
          aws lambda invoke --function-name "db-updator" --cli-binary-format raw-in-base64-out --payload '{"category" : "Processor"}' response.json
          echo "Response from DB Updator:"
          cat response.json
          echo "DB Updator invoked successfully."
